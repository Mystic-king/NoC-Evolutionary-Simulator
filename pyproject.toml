[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noc-evolutionary-simulator"
version = "1.1.0"
description = "Educational simulator for NoC and evolutionary optimization experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.32,<2",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "matplotlib>=3.7,<4",
  "PyYAML>=6,<7",
  "networkx>=3.2,<4",
  "torch>=2.2",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]

[project.scripts]
nocsim = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "modules*", "interface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
